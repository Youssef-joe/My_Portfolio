<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="auto" style="background:#0f172a; border-radius:4px; font-family:Verdana, Geneva, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Bar -->
  <rect x="0" y="0" width="800" height="42" fill="url(#headerGrad)"/>
  <text x="20" y="26" font-size="12" font-weight="bold" fill="#38bdf8" font-family="'Space Mono', monospace">FIG 1.0 // B+TREE NODE HIERARCHY &amp; SLOTTED PAGE STORAGE ENGINE</text>
  <rect x="740" y="14" width="40" height="14" rx="2" fill="#10b981" fill-opacity="0.2"/>
  <text x="748" y="24" font-size="9" font-family="monospace" fill="#10b981">Go v1.22</text>

  <!-- ROOT NODE -->
  <g transform="translate(280, 65)" filter="url(#shadow)">
    <rect width="240" height="55" rx="4" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="18" rx="4" fill="#0284c7"/>
    <text x="120" y="13" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ROOT NODE (Internal)</text>
    <text x="35" y="38" font-size="11" font-weight="bold" fill="#f8fafc">Key: 50</text>
    <text x="120" y="38" font-size="11" font-weight="bold" fill="#f8fafc">Key: 100</text>
    <circle cx="85" cy="48" r="4" fill="#38bdf8"/>
    <circle cx="170" cy="48" r="4" fill="#38bdf8"/>
  </g>

  <!-- Connectors from Root to Internal -->
  <path d="M 330 120 L 200 170" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 470 120 L 600 170" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- INTERNAL NODES -->
  <g transform="translate(100, 170)" filter="url(#shadow)">
    <rect width="200" height="50" rx="4" fill="url(#nodeGrad)" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="100" y="18" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">INTERNAL NODE A (Keys &lt; 50)</text>
    <text x="50" y="38" font-size="10" fill="#e2e8f0">Ptr 1</text>
    <text x="100" y="38" font-size="10" font-weight="bold" fill="#e2e8f0">[Key: 25]</text>
    <text x="160" y="38" font-size="10" fill="#e2e8f0">Ptr 2</text>
  </g>

  <g transform="translate(500, 170)" filter="url(#shadow)">
    <rect width="200" height="50" rx="4" fill="url(#nodeGrad)" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="100" y="18" font-size="9" font-weight="bold" fill="#38bdf8" text-anchor="middle">INTERNAL NODE B (Keys ≥ 50)</text>
    <text x="50" y="38" font-size="10" fill="#e2e8f0">Ptr 1</text>
    <text x="100" y="38" font-size="10" font-weight="bold" fill="#e2e8f0">[Key: 75]</text>
    <text x="160" y="38" font-size="10" fill="#e2e8f0">Ptr 2</text>
  </g>

  <!-- Connectors to Leaf -->
  <path d="M 150 220 L 100 270" stroke="#0ea5e9" stroke-width="1.2"/>
  <path d="M 250 220 L 280 270" stroke="#0ea5e9" stroke-width="1.2"/>
  <path d="M 550 220 L 520 270" stroke="#0ea5e9" stroke-width="1.2"/>
  <path d="M 650 220 L 700 270" stroke="#0ea5e9" stroke-width="1.2"/>

  <!-- LEAF NODES (Linked List) -->
  <g transform="translate(20, 270)" filter="url(#shadow)">
    <rect width="170" height="55" rx="4" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="170" height="15" rx="4" fill="#059669"/>
    <text x="85" y="11" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LEAF NODE 1 (Records)</text>
    <text x="15" y="34" font-size="10" fill="#cbd5e1">[10: "valA"]</text>
    <text x="95" y="34" font-size="10" fill="#cbd5e1">[20: "valB"]</text>
    <text x="85" y="48" font-size="8" fill="#10b981" text-anchor="middle">Next Leaf ➔</text>
  </g>

  <!-- Linked list arrow -->
  <path d="M 190 295 L 210 295" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(210, 270)" filter="url(#shadow)">
    <rect width="170" height="55" rx="4" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="170" height="15" rx="4" fill="#059669"/>
    <text x="85" y="11" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LEAF NODE 2 (Records)</text>
    <text x="15" y="34" font-size="10" fill="#cbd5e1">[30: "valC"]</text>
    <text x="95" y="34" font-size="10" fill="#cbd5e1">[45: "valD"]</text>
    <text x="85" y="48" font-size="8" fill="#10b981" text-anchor="middle">Next Leaf ➔</text>
  </g>

  <g transform="translate(420, 270)" filter="url(#shadow)">
    <rect width="170" height="55" rx="4" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="170" height="15" rx="4" fill="#059669"/>
    <text x="85" y="11" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LEAF NODE 3 (Records)</text>
    <text x="15" y="34" font-size="10" fill="#cbd5e1">[60: "valE"]</text>
    <text x="95" y="34" font-size="10" fill="#cbd5e1">[70: "valF"]</text>
    <text x="85" y="48" font-size="8" fill="#10b981" text-anchor="middle">Next Leaf ➔</text>
  </g>

  <g transform="translate(610, 270)" filter="url(#shadow)">
    <rect width="170" height="55" rx="4" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="170" height="15" rx="4" fill="#059669"/>
    <text x="85" y="11" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">LEAF NODE 4 (Records)</text>
    <text x="15" y="34" font-size="10" fill="#cbd5e1">[85: "valG"]</text>
    <text x="95" y="34" font-size="10" fill="#cbd5e1">[99: "valH"]</text>
    <text x="85" y="48" font-size="8" fill="#94a3b8" text-anchor="middle">NULL (End)</text>
  </g>

  <!-- DISK PAGE STRUCTURE FOOTER -->
  <g transform="translate(20, 350)">
    <rect width="760" height="70" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="15" y="20" font-size="10" font-weight="bold" fill="#f59e0b" font-family="'Space Mono', monospace">DISK LAYER: 4096-BYTE SLOTTED PAGE LAYOUT ON STORAGE</text>
    
    <!-- Page Slots -->
    <g transform="translate(15, 30)">
      <rect x="0" y="0" width="120" height="28" fill="#3b82f6" rx="2"/>
      <text x="60" y="18" font-size="9" fill="#ffffff" font-weight="bold" text-anchor="middle">Page Header (24B)</text>

      <rect x="125" y="0" width="160" height="28" fill="#0284c7" rx="2"/>
      <text x="205" y="18" font-size="9" fill="#ffffff" text-anchor="middle">Slot Offsets [0..N] ➔</text>

      <rect x="290" y="0" width="230" height="28" fill="#334155" rx="2" stroke="#64748b" stroke-dasharray="2,2"/>
      <text x="405" y="18" font-size="9" fill="#94a3b8" text-anchor="middle">Free Space Window</text>

      <rect x="525" y="0" width="100" height="28" fill="#059669" rx="2"/>
      <text x="575" y="18" font-size="9" fill="#ffffff" text-anchor="middle">Tuple Data 2</text>

      <rect x="630" y="0" width="100" height="28" fill="#059669" rx="2"/>
      <text x="680" y="18" font-size="9" fill="#ffffff" text-anchor="middle">Tuple Data 1</text>
    </g>
  </g>
</svg>
