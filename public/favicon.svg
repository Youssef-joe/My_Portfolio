<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Outer bevel plate -->
  <rect width="32" height="32" rx="6" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35"/>
  
  <!-- Terminal / Code brackets accent -->
  <path d="M 6 11 L 9 16 L 6 21" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Stylized 'Y' and 'A' monogram -->
  <text x="12" y="21" font-family="Verdana, -apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="-0.5">YA</text>
  
  <!-- Online status indicator dot -->
  <circle cx="26" cy="10" r="2.2" fill="#10b981"/>
  <circle cx="26" cy="10" r="3.2" fill="none" stroke="#10b981" stroke-width="0.8" opacity="0.6"/>
</svg>
